<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İlan Ver - Araba Dünyası</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="brand">
            <a href="index.html">🚗 Araba Dünyası</a>
        </div>
        <nav class="main-nav">
            <a href="index.html">Araçlar</a>
            <a href="ads.html">İlanlar</a>
            <a href="form.html">İlan Ver</a>
        </nav>
    </header>

    <main class="site-main">
        <div class="form-page">
            <div class="form-card">
                <h1 id="formTitle">Yeni Araç İlanı Ver</h1>
                <p style="color: #475569; margin-bottom: 28px;">Aracınızın detaylarını girin ve ilanınızı yayınlayın.</p>

                <form id="carForm">
                    <div class="field-row grid-2">
                        <div>
                            <label for="Marka">Marka *</label>
                            <input type="text" id="Marka" name="Marka" placeholder="BMW, Mercedes, Renault..." required />
                        </div>
                        <div>
                            <label for="series">Seri *</label>
                            <input type="text" id="series" name="series" placeholder="5 Serisi, E-Klasse..." required />
                        </div>
                    </div>

                    <div class="field-row">
                        <label for="model">Model *</label>
                        <input type="text" id="model" name="model" placeholder="525d xDrive Premium..." required />
                    </div>

                    <div class="field-row grid-2">
                        <div>
                            <label for="price">Fiyat (TL) *</label>
                            <input type="number" id="price" name="price" placeholder="1425000" required min="0" />
                        </div>
                        <div>
                            <label for="year">Yıl *</label>
                            <input type="number" id="year" name="year" placeholder="2020" required min="2010" max="2026" />
                        </div>
                    </div>

                    <div class="field-row grid-2">
                        <div>
                            <label for="Kilometre">Kilometre *</label>
                            <input type="number" id="Kilometre" name="Kilometre" placeholder="50000" required min="0" />
                        </div>
                        <div>
                            <label for="fuel">Yakıt *</label>
                            <select id="fuel" name="fuel" required>
                                <option value="">Seçin...</option>
                                <option value="Benzin">Benzin</option>
                                <option value="Dizel">Dizel</option>
                                <option value="Benzin & LPG">Benzin & LPG</option>
                                <option value="Elektrik">Elektrik</option>
                            </select>
                        </div>
                    </div>

                    <div class="field-row grid-2">
                        <div>
                            <label for="transmission">Vites *</label>
                            <select id="transmission" name="transmission" required>
                                <option value="">Seçin...</option>
                                <option value="Manuel">Manuel</option>
                                <option value="Otomatik">Otomatik</option>
                            </select>
                        </div>
                        <div>
                            <label for="motorgücü">Motor Gücü (hp)</label>
                            <input type="text" id="motorgücü" name="motorgücü" placeholder="218 hp" />
                        </div>
                    </div>

                    <div class="field-row grid-2">
                        <div>
                            <label for="body">Gövde Tipi *</label>
                            <select id="body" name="body" required>
                                <option value="">Seçin...</option>
                                <option value="Sedan">Sedan</option>
                                <option value="Hatchback">Hatchback</option>
                                <option value="SUV">SUV</option>
                                <option value="Coupe">Coupe</option>
                                <option value="Minivan">Minivan</option>
                            </select>
                        </div>
                        <div>
                            <label for="drive">Çekiş *</label>
                            <select id="drive" name="drive" required>
                                <option value="">Seçin...</option>
                                <option value="Önden Çekiş">Önden Çekiş</option>
                                <option value="Arkadan Çekiş">Arkadan Çekiş</option>
                                <option value="4x4">4x4</option>
                            </select>
                        </div>
                    </div>

                    <div class="field-row grid-2">
                        <div>
                            <label for="color">Renk *</label>
                            <input type="text" id="color" name="color" placeholder="Beyaz, Siyah..." required />
                        </div>
                        <div>
                            <label for="doors">Kapı Sayısı</label>
                            <input type="number" id="doors" name="doors" placeholder="5" min="2" max="5" />
                        </div>
                    </div>

                    <div class="field-row">
                        <label for="summary">Açıklama *</label>
                        <textarea id="summary" name="summary" placeholder="Aracınız hakkında kısa bir açıklama..." rows="4" required></textarea>
                    </div>

                    <div class="field-row">
                        <label for="images">Fotoğraflar</label>
                        <input type="file" id="images" name="images" multiple accept="image/*" />
                        <p class="hint">Maksimum 5 fotoğraf, her biri 2MB'tan küçük olmalı.</p>
                    </div>

                    <div class="field-row">
                        <label for="guarantee">Garanti Durumu</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="guarantee" value="Evet"> Garantili
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="guarantee" value="Hayır" checked> Garanti Yok
                            </label>
                        </div>
                    </div>

                    <button type="submit" id="submitButton" class="button" style="width: 100%; margin-top: 24px;">İlanı Gönder</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Araba Dünyası. Tüm Hakları Saklıdır.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="supabase.js"></script>
    <script>
        const form = document.getElementById("carForm");
        const imagesInput = document.getElementById("images");
        const fuelSelect = document.getElementById("fuel");
        const motorInput = document.getElementById("motorgücü");
        const formTitle = document.getElementById("formTitle");
        const submitButton = document.getElementById("submitButton");
        const editId = new URLSearchParams(window.location.search).get("id");

        function applyFuelState() {
            if (fuelSelect.value === "Elektrik") {
                motorInput.value = "Elektrik motor";
                motorInput.disabled = true;
            } else {
                motorInput.disabled = false;
                if (motorInput.value === "Elektrik motor") {
                    motorInput.value = "";
                }
            }
        }

        function readAd() {
            const doors = document.getElementById("doors").value;
            const power = motorInput.value.trim();
            const guarantee = form.querySelector('input[name="guarantee"]:checked');

            return {
                marka: document.getElementById("Marka").value.trim(),
                series: document.getElementById("series").value.trim(),
                model: document.getElementById("model").value.trim(),
                price: Number(document.getElementById("price").value),
                year: Number(document.getElementById("year").value),
                kilometre: Number(document.getElementById("Kilometre").value),
                fuel: fuelSelect.value,
                transmission: document.getElementById("transmission").value,
                body: document.getElementById("body").value,
                drive: document.getElementById("drive").value,
                color: document.getElementById("color").value.trim(),
                doors: doors === "" ? null : Number(doors),
                power: power || null,
                guarantee: guarantee ? guarantee.value : "Hayır",
                summary: document.getElementById("summary").value.trim()
            };
        }

        function fillForm(ad) {
            document.getElementById("Marka").value = ad.marka || "";
            document.getElementById("series").value = ad.series || "";
            document.getElementById("model").value = ad.model || "";
            document.getElementById("price").value = ad.price ?? "";
            document.getElementById("year").value = ad.year ?? "";
            document.getElementById("Kilometre").value = ad.kilometre ?? "";
            fuelSelect.value = ad.fuel || "";
            document.getElementById("transmission").value = ad.transmission || "";
            motorInput.value = ad.power || "";
            document.getElementById("body").value = ad.body || "";
            document.getElementById("drive").value = ad.drive || "";
            document.getElementById("color").value = ad.color || "";
            document.getElementById("doors").value = ad.doors ?? "";
            document.getElementById("summary").value = ad.summary || "";
            const guarantee = ad.guarantee === "Evet" ? "Evet" : "Hayır";
            const guaranteeInput = form.querySelector(`input[name="guarantee"][value="${guarantee}"]`);
            if (guaranteeInput) {
                guaranteeInput.checked = true;
            }
            applyFuelState();
        }

        async function loadAd() {
            if (!editId) {
                return;
            }
            formTitle.textContent = "İlanı Düzenle";
            submitButton.textContent = "İlanı Güncelle";
            if (!requireSupabase()) {
                return;
            }
            const { data, error } = await db
                .from("ilanlar")
                .select("*")
                .eq("id", editId)
                .maybeSingle();
            if (error || !data) {
                alert(error ? "İlan yüklenemedi: " + error.message : "İlan bulunamadı.");
                return;
            }
            fillForm(data);
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            const marka = document.getElementById("Marka").value.trim();
            const year = Number(document.getElementById("year").value);
            const kilometre = Number(document.getElementById("Kilometre").value);

            if (!marka) {
                alert("Marka alanı boş bırakılamaz!");
                return;
            }
            if (year < 2010 || year > 2026) {
                alert("Yıl 2010 ile 2026 arasında olmalıdır!");
                return;
            }
            if (kilometre < 0) {
                alert("Kilometre 0'dan küçük olamaz!");
                return;
            }
            if (!requireSupabase()) {
                return;
            }

            const payload = readAd();
            const query = editId
                ? db.from("ilanlar").update(payload).eq("id", editId)
                : db.from("ilanlar").insert(payload);
            const { error } = await query;

            if (error) {
                alert("Kayıt başarısız: " + error.message);
                return;
            }

            alert(editId ? "İlan güncellendi." : "İlanınız başarıyla kaydedildi!");
            window.location.href = "ads.html";
        });

        imagesInput.addEventListener("change", function (event) {
            const files = event.target.files;
            const maxSize = 2 * 1024 * 1024;
            for (const file of files) {
                if (file.size > maxSize) {
                    alert(`${file.name} dosyası çok büyük! Maksimum 2MB.`);
                    event.target.value = "";
                    break;
                }
            }
        });

        fuelSelect.addEventListener("change", applyFuelState);
        loadAd();
    </script>
</body>
</html>
